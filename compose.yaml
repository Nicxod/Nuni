services:
  db:
    image: postgres:16-alpine
    container_name: cassavaflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cassavaflow}
      POSTGRES_USER: ${POSTGRES_USER:-cassavaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cassavaflow} -d ${POSTGRES_DB:-cassavaflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cassavaflow_network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: cassavaflow_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cassavaflow}:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/${POSTGRES_DB:-cassavaflow}
      SECRET_KEY: ${SECRET_KEY:-cassavaflow_secret_key_development_must_change_in_production_2026}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cassavaflow_network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cassavaflow_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cassavaflow_network

volumes:
  postgres_data:
    name: cassavaflow_postgres_data

networks:
  cassavaflow_network:
    name: cassavaflow_network
